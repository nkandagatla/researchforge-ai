[project]
name = "researchforge-ai-v2"
version = "2.0.0"
description = "Research you can audit, and that remembers: multi-agent deep research with a verified second brain"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.50", "langchain-core>=0.3", "langchain-openai>=0.3", "langgraph>=1.0", "langgraph-checkpoint-sqlite>=2.0",
  "aiosqlite>=0.20", "mcp>=1.9,<2", "arxiv>=2.1", "pymupdf>=1.24", "pydantic>=2.7", "httpx>=0.27", "python-dotenv>=1.0",
  "plotly>=5.20", "numpy>=2.1", "fastembed>=0.6", "lancedb>=0.20", "langsmith>=0.3", "langfuse>=3.0", "langchain>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = [".models", ".memory"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]  # import order kept by hand (compact)
ignore = ["RUF001", "SIM905"]

[tool.mypy]
python_version = "3.11"
files = ["app.py", "ui", "evals", "agents.py", "jobs.py", "tools.py", "models.py", "evidence.py", "memory.py", "run_cli.py"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: live MCP, arXiv, OpenRouter and model downloads (needs network + .env keys)"]
addopts = "-m 'not integration'"
